name: bot-bourse
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: writeconcurrency:
  group: bot-bourse

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance feedparser requests pandas
      - run: python bot_bourse.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - run: |
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git add etat.json
          git diff --cached --quiet || (git commit -m "etat" && git push)
